services:
  ddb:
    # postgres:15-alpine + pgvector (see db/docker/Dockerfile for why it's
    # built from source instead of using the pgvector/pgvector image)
    build:
      context: ./db/docker
    image: techhire-postgres-pgvector
    container_name: techhire_db
    environment:
      POSTGRES_USER: techhire
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: techhire_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techhire"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: techhire_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: techhire_api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://techhire:localdev@ddb:5432/techhire_db
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      ddb:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: techhire_frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
    driver: local